name: T1 T2 T3 SEC Backtest
on:
  push:
    paths:
      - 'analysis/t1t2t3_sec.py'
      - '.github/workflows/t1t2t3_sec.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow
      - run: python analysis/t1t2t3_sec.py
      - uses: actions/upload-artifact@v4
        with:
          name: t1t2t3-sec-results
          path: |
            sec_summary.json
            sec_grid.csv
