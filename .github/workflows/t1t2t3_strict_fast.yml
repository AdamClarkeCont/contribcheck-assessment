name: T1 T2 T3 Strict Fast Backtest
on:
  push:
    paths:
      - 'analysis/t1t2t3_strict_fast.py'
      - '.github/workflows/t1t2t3_strict_fast.yml'
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow yfinance
      - run: python analysis/t1t2t3_strict_fast.py
      - uses: actions/upload-artifact@v4
        with:
          name: t1t2t3-strict-results
          path: |
            strict_summary.json
            strict_grid.csv
